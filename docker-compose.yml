# Production stack for one server (e.g. AWS EC2). See DEPLOY.md.
#   caddy  – HTTPS (automatic Let's Encrypt certificates) → web
#   web    – FastAPI app; runs DB migrations on start
#   bot    – Telegram bot (long polling, no inbound ports)
#   db     – PostgreSQL 16
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tolk}
      POSTGRES_USER: ${POSTGRES_USER:-tolk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: tolk:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tolk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tolk}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  bot:
    build: .
    image: tolk:latest
    command: ["bot"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tolk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tolk}
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
